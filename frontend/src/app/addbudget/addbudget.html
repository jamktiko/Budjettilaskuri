<mat-dialog-content *ngIf="loading">
  <div>Ladataan tietoja...</div>
</mat-dialog-content>

<ng-container *ngIf="!loading && !isSubmitted">
  <h2 mat-dialog-title class="title">Luo budjetti</h2>

  <mat-dialog-content>
    <p class="subtitle">Aseta kuukausi- tai viikkobudjetti</p>

    <form [formGroup]="form" id="budgetForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Budjetti raja (€)</mat-label>
        <input matInput type="number" formControlName="amount" />
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Peruuta</button>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      form="budgetForm"
      [disabled]="form.invalid"
    >
      {{ isEditing ? 'Tallenna muutokset' : 'Luo Budjetti' }}
    </button>
  </mat-dialog-actions>
</ng-container>

<ng-container *ngIf="!loading && isSubmitted">
  <h2 mat-dialog-title class="title">Budjetti asetettu!</h2>

  <mat-dialog-content class="success-card">
    <div class="success-icon">✅</div>

    <div class="budget-details">
      <div class="detail-item">
        <span>Summa:</span>
        <strong>{{ createdBudget?.amount | number: '1.2-2' }} €</strong>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="true">Sulje</button>

    <button mat-stroked-button color="primary" (click)="startEdit(createdBudget)">
      Muokkaa tietoja
    </button>
  </mat-dialog-actions>
</ng-container>
