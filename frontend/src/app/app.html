<div class="app" [class.dark-theme]="isDark">
  <header class="top-bar" *ngIf="showNav">
    <div class="top-bar-left">
      <a routerLink="/home" aria-label="Home">
        <img src="/logo.png" alt="Logo" class="top-bar-logo" />
      </a>
    </div>
    <div class="top-bar-right">
      <button mat-icon-button aria-label="Ilmoitukset" (click)="openNotificationsDialog()">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button aria-label="Profiili" routerLink="/profile" routerLinkActive="active">
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
